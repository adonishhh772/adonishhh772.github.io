name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; never cancel in-progress runs so a
# half-deployed site is not interrupted by a newer build.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NEWSLETTER_FORM_URL is read at build time from the repository
      # environment / variables settings (Settings → Secrets and variables
      # → Actions → Variables). Leave unset to show the "launching soon"
      # placeholder on the sign-up forms.
      - name: Build
        run: npm run build
        env:
          NEWSLETTER_FORM_URL: ${{ vars.NEWSLETTER_FORM_URL }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
