<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="t d">
  <title id="t">Two voice-agent architectures: cascaded pipeline vs speech-to-speech</title>
  <desc id="d">A cascaded pipeline keeps a text layer between transcription and speech synthesis where compliance checks and audits run; a fused speech-to-speech model trades that control point for lower latency.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10131a"/>
      <stop offset="1" stop-color="#0b0d10"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a4abb5"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="958" height="428" rx="18" fill="url(#bg2)" stroke="#2a2f39" stroke-width="1.5"/>

  <!-- Cascaded row -->
  <text x="48" y="48" font-family="JetBrains Mono, Menlo, monospace" font-size="13" letter-spacing="2" fill="#c8ff00">CASCADED — DIRECT PROVIDERS</text>
  <text x="48" y="70" font-family="Inter, Arial, sans-serif" font-size="12" fill="#a4abb5">separate specialists per stage · text layer = compliance + audit point</text>

  <g font-family="Inter, Arial, sans-serif">
    <rect x="48" y="96" width="128" height="54" rx="10" fill="#0b0d10" stroke="#3a4150" stroke-width="1.4"/>
    <text x="112" y="120" text-anchor="middle" font-size="14" fill="#f4f4f0">STT</text>
    <text x="112" y="138" text-anchor="middle" font-size="11" fill="#a4abb5">transcription</text>

    <rect x="196" y="96" width="128" height="54" rx="10" fill="#0b0d10" stroke="#3a4150" stroke-width="1.4"/>
    <text x="260" y="120" text-anchor="middle" font-size="14" fill="#f4f4f0">LLM</text>
    <text x="260" y="138" text-anchor="middle" font-size="11" fill="#a4abb5">reasoning</text>

    <rect x="344" y="96" width="128" height="54" rx="10" fill="#0b0d10" stroke="#3a4150" stroke-width="1.4"/>
    <text x="408" y="120" text-anchor="middle" font-size="14" fill="#f4f4f0">TTS</text>
    <text x="408" y="138" text-anchor="middle" font-size="11" fill="#a4abb5">speech</text>

    <line x1="176" y1="123" x2="196" y2="123" stroke="#a4abb5" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="324" y1="123" x2="344" y2="123" stroke="#a4abb5" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- text layer gate between LLM and TTS row -->
  <rect x="520" y="86" width="200" height="74" rx="10" fill="#0e1117" stroke="#c8ff00" stroke-opacity="0.5" stroke-width="1.3"/>
  <text x="620" y="110" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#c8ff00">TEXT-LAYER GATE</text>
  <text x="620" y="129" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="10.5" fill="#a4abb5">PII redaction · disclaimers</text>
  <text x="620" y="146" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="10.5" fill="#a4abb5">guardrails · audit log</text>

  <text x="740" y="130" font-family="JetBrains Mono, Menlo, monospace" font-size="12" fill="#f4f4f0">≈ 300–500 ms</text>
  <text x="740" y="150" font-family="Inter, Arial, sans-serif" font-size="11" fill="#6b7280">optimised &amp; streaming</text>

  <!-- S2S row -->
  <text x="48" y="238" font-family="JetBrains Mono, Menlo, monospace" font-size="13" letter-spacing="2" fill="#f4f4f0">FUSED — SPEECH-TO-SPEECH (MANAGED PLATFORMS)</text>
  <text x="48" y="260" font-family="Inter, Arial, sans-serif" font-size="12" fill="#a4abb5">one model, audio in → audio out · no text checkpoint before delivery</text>

  <rect x="48" y="286" width="170" height="58" rx="10" fill="#0b0d10" stroke="#3a4150" stroke-width="1.4"/>
  <text x="133" y="310" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#f4f4f0">audio in</text>
  <text x="133" y="329" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="10.5" fill="#a4abb5">voice · emotion · context</text>

  <rect x="258" y="276" width="196" height="78" rx="12" fill="#0b0d10" stroke="#3a4150" stroke-width="1.6"/>
  <text x="356" y="304" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#f4f4f0">S2S model</text>
  <text x="356" y="324" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" fill="#a4abb5">fused reasoning + voice</text>
  <text x="356" y="342" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="10.5" fill="#6b7280">no text layer to audit</text>

  <rect x="494" y="286" width="170" height="58" rx="10" fill="#0b0d10" stroke="#3a4150" stroke-width="1.4"/>
  <text x="579" y="310" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#f4f4f0">audio out</text>
  <text x="579" y="329" text-anchor="middle" font-family="JetBrains Mono, Menlo, monospace" font-size="10.5" fill="#a4abb5">natural prosody · fast</text>

  <text x="692" y="316" font-family="JetBrains Mono, Menlo, monospace" font-size="12" fill="#f4f4f0">≈ 200–300 ms</text>

  <g font-family="JetBrains Mono, Menlo, monospace" font-size="10.5">
    <line x1="218" y1="315" x2="256" y2="315" stroke="#a4abb5" stroke-width="1.5" marker-end="url(#arr)"/>
    <line x1="454" y1="315" x2="492" y2="315" stroke="#a4abb5" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- bottom note -->
  <text x="48" y="396" font-family="Inter, Arial, sans-serif" font-size="12.5" fill="#6b7280">The marketing delta is ~1.5 s; the engineering delta is a few hundred ms — that is what you are actually trading for control.</text>
</svg>
